id: missing-definition-of-entity-group-id
kind: test
level: mandatory
legacy:
  number: 6.1.64.7
  file: tests-01-mndtr-64-07-missing-definition-of-entity-group-id.md
heading: 4
title: Missing Definition of Entity Group ID
statement: |-
  For each element of type `$['$defs'].entity_group_id_t` which is not inside the list of entity groups (`$.document.involvement.entity_groups`)
  and therefore references an item within the list of entity groups
  it SHALL be tested that the Entity Group element with the matching `entity_group_id` exists.
  This test SHALL ignore elements of type `$['$defs'].entity_id_t` in items of elements of type `$['$defs'].entity_refs_id_t`.
paths:
- $.document.involvement.actions[*].acting_entity_refs[*]
- $.document.involvement.actions[*].receiving_entity_refs[*]
examples:
- verdict: fails
  json: |2-
      "involvement": {
        "actions": [
          {
            "acting_entity_refs": [
              "EGID-9011"
            ],
            "action_id": "ACN-1",
            "category": "notification",
            "date": "2024-01-10T09:00:00Z",
            "receiving_entity_refs": [
              "EID-0002"
            ],
            "status": "completed",
            "summary": "Reported vulnerability to vendor."
          },
          // ...
        ],
        // ...
        "entity_groups": [
          {
            "entity_group_id": "EGID-9001",
            "entity_ids": [
              "EID-0001",
              "EID-0003"
            ],
            "name": "JJ Research"
          }
        ]
      },
  explanation:
  - The action `ACN-1` contains `EGID-9011` as acting entity which is not defined in the list of entity groups.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-07-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-07-02.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-07-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-07-12.json
    valid: true
