id: reference-to-superseding-document
kind: test
level: mandatory
legacy:
  number: 6.1.27.19
  file: tests-01-mndtr-27-19-reference-to-superseding-document.md
heading: 4
title: Reference to Superseding Document
statement: |-
  If the document language is English or unspecified, it SHALL be tested that at least one item in document references exists
  that has a summary starting with `Superseding Document`.
  For each of these items, the `category` SHALL be present and have the value `external`.
applies-to:
  only:
  - csaf_superseded
paths:
- $.document.references
examples:
- verdict: fails
  json: |2-
        "references": [
          {
            "category": "external",
            "summary": "Superseded Document",
            "url": "https://example.com/.well-known/csaf/clear/2024/esa-2024-1234.json"
          }
        ],
  explanation:
  - There is no reference where the `summary` starts with the correct term `Superseding Document`.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-01.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-01.result.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-02.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-02.result.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-03.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-03.result.json
    valid: false
  valid:
