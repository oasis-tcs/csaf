    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-11.result.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-12.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-27-19-12.result.json
