id: license-text
kind: test
level: mandatory
legacy:
  number: 6.1.55
  file: tests-01-mndtr-55-license-text.md
heading: 3
title: License Text
statement: |-
  If the document language is English or unspecified,
  and the `license_expression` contains license identifiers or exceptions that are not listed in the SPDX license list or AboutCode's "ScanCode LicenseDB",
  it SHALL be tested that exactly one item in document notes exists that has the title `License`.
  The category of this item SHALL be `legal_disclaimer`.
paths:
- $.document.notes
examples:
- verdict: fails
  json: "  \"document\": {\n    // ...\n    \"license_expression\": \"LicenseRef-www.example.com-no-work-pd\",\n    \"notes\": [\n      {\n        \"category\": \"other\",\n        \"text\": \"This is not a work and therefore it can't be licensed. Use it as public domain.\",\n        \"title\": \"License\"\n      }\n    ],\n    // ...\n  }  "
  explanation:
  - The note has the correct title. However, it uses the wrong category.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-55-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-55-02.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-55-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-55-12.json
    valid: true
