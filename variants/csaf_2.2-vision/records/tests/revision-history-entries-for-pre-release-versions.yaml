id: revision-history-entries-for-pre-release-versions
kind: test
level: mandatory
topics: [revision-history]
legacy:
  number: 6.1.19
  file: tests-01-mndtr-19-revision-history-entries-for-pre-release-versions.md
heading: 3
title: Revision History Entries for Pre-release Versions
statement: It SHALL be tested that no item of the revision history has a `number` which includes pre-release information.
paths:
- $.document.tracking.revision_history[*].number
examples:
- verdict: fails
  json: |2-
        "revision_history": [
          {
            "date": "2023-08-22T10:00:00.000Z",
            "number": "1.0.0-rc",
            "summary": "Release Candidate for initial version."
          },
          {
            "date": "2023-08-23T10:00:00.000Z",
            "number": "1.0.0",
            "summary": "Initial version."
          }
        ]
  explanation:
  - The revision history contains an item which has a `number` that indicates that this is pre-release.
notes:
- |-
  > A tool MAY merge each item of the revision history that has a `number` which includes pre-release information into
  > the corresponding item which contains the same `number` without pre-release information as a quick fix.
  > If no such item exists, the tool MAY just remove the pre-release information from the `number` instead of merging the item.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-19-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-19-02.json
    valid: false
