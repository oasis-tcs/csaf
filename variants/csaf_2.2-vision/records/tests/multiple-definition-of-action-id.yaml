id: multiple-definition-of-action-id
kind: test
level: mandatory
legacy:
  number: 6.1.64.10
  file: tests-01-mndtr-64-10-multiple-definition-of-action-id.md
heading: 4
title: Multiple Definition of Action ID
statement: |-
  For each element of type `$['$defs'].action_id_t` which is defining an action (`$.document.involvement.actions[*].action_id`)
  it SHALL be tested that the `action_id` was not already defined within the same document.
paths:
- $.document.involvement.actions[*].action_id
examples:
- verdict: fails
  json: |2-
      "actions": [
        {
          // ...
          "action_id": "ACN-1",
          // ...
        },
        {
          // ...
          "action_id": "ACN-1",
          // ...
        },
        // ...
      ],
  explanation:
  - '`ACN-1` was defined twice.'
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-10-01.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-10-11.json
    valid: true
