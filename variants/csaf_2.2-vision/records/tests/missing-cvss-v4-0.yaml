id: missing-cvss-v4-0
kind: test
level: informative
legacy:
  number: 6.3.12
  file: tests-03-nfrmtv-12-missing-cvss-v4-0.md
heading: 3
title: Missing CVSS v4.0
statement: |-
  For each item in the list of metrics that contains any CVSS object it SHALL be tested that a `cvss_v4` object is present.
  The test SHALL fail, if any Product ID (type `$['$defs'].product_id_t`) in the product status group Affected (see section [sec](#vulnerabilities-property-product-status)) is not covered by
  any CVSS object.
paths:
- $.vulnerabilities[*].metrics[*].content
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "product_id": "CSAFPID-9080700",
            "name": "Product A"
          }
        ]
      },
      "vulnerabilities": [
        {
          "metrics": [
            {
              "content": {
                "cvss_v3": {
                  "version": "3.1",
                  "vectorString": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H",
                  "baseScore": 10,
                  "baseSeverity": "CRITICAL"
                }
              },
              "products": [
                "CSAFPID-9080700"
              ]
            }
          ]
        }
      ]
  explanation:
  - There is no CVSS v4.0 score given for `CSAFPID-9080700`.
