id: use-of-qualitative-severity-rating-by-issuing-party
kind: test
level: recommended
legacy:
  number: 6.2.47
  file: tests-02-rcmmndd-47-use-of-qualitative-severity-rating-by-issuing-party.md
heading: 3
title: Use of Qualitative Severity Rating by Issuing Party
statement: |-
  For each item in `metrics` provided by the issuing party it SHALL be tested that it does not use the qualitative severity rating.

  > This covers all items in `metrics` that do not have a `source` property and those where the `source` is equal to
  > the canonical URL.
  > It does not cover assessments made by third parties.
paths:
- $.vulnerabilities[*].metrics[*]
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "product_id": "CSAFPID-9080700",
            "name": "Product A"
          }
        ]
      },
      "vulnerabilities": [
        {
          "metrics": [
            {
              "content": {
                "qualitative_severity_rating": "low"
              },
              "products": [
                "CSAFPID-9080700"
              ]
            }
          ]
        }
      ]
  explanation:
  - The document issuer provided metric for `CSAFPID-9080700` uses a `qualitative_severity_rating`.
notes:
- '> A tool MAY recommend other metrics or guide a CVSS assessment.'
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-47-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-47-02.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-47-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-47-12.json
    valid: true
