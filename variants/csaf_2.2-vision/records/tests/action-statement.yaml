id: action-statement
kind: test
level: mandatory
legacy:
  number: 6.1.27.10
  file: tests-01-mndtr-27-10-action-statement.md
heading: 4
title: Action Statement
statement: |-
  For each item in `$.vulnerabilities[*].product_status.known_affected` it SHALL be tested that
  a corresponding action statement exist in `$.vulnerabilities[*].remediations`.
applies-to:
  only:
  - csaf_vex
paths:
- $.vulnerabilities[*].remediations
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "product_id": "CSAFPID-9080700",
            "name": "Product A"
          },
          {
            "product_id": "CSAFPID-9080701",
            "name": "Product B"
          },
          {
            "product_id": "CSAFPID-9080702",
            "name": "Product C"
          }
        ],
        "product_groups": [
          {
            "group_id": "CSAFGID-0001",
            "product_ids": [
              "CSAFPID-9080700",
              "CSAFPID-9080701"
            ],
            "summary": "EOL products"
          }
        ]
      },
      "vulnerabilities": [
        {
          // ...
          "product_status": {
            "known_affected": [
              "CSAFPID-9080700",
              "CSAFPID-9080701",
              "CSAFPID-9080702"
            ]
          },
          "remediations": [
            {
              "category": "no_fix_planned",
              "details": "These products are end-of-life. Therefore, no fix will be provided.",
              "group_ids": [
                "CSAFGID-0001"
              ]
            }
          ]
        }
      ]
  explanation:
  - |-
    There is no action statement for `CSAFPID-9080702`.

    Note: The action statement for `CSAFPID-9080700` and `CSAFPID-9080701` is given through `CSAFGID-0001`.
fixtures:
  failures:
