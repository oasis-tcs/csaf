id: language-specific-superseding-document
kind: test
level: recommended
legacy:
  number: 6.2.39.4
  file: tests-02-rcmmndd-39-04-language-specific-superseding-document.md
heading: 4
title: Language Specific Superseding Document
statement: |-
  If the document language is specified but not English, it SHALL be tested that at least one item in document references exists
  that starts with the language specific translation of the term `Superseding Document` as `summary`.
  For each of these items, the `category` SHALL be present and have the value `external`.
  If no language specific translation has been recorded, the test SHALL be skipped and output an information to the user that no such translation is known.

  > A list of the language specific translations is kept at the OASIS CSAF TC.
applies-to:
  only:
  - csaf_superseded
paths:
- $.document.references
examples:
- verdict: fails
  json: |2-
        "references": [
          {
            "category": "external",
            "summary": "Ersetztes Dokument",
            "url": "https://example.com/.well-known/csaf/clear/2024/esa-2024-1234.json"
          }
        ],
  explanation:
  - There is no reference where the `summary` starts with the correct term `Ersetzendes Dokument`.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-01.json
    result: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-01.result.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-02.json
    result: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-02.result.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-11.json
    result: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-11.result.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-12.json
    result: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-39-04-12.result.json
    valid: true
