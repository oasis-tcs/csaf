id: branch-categories
kind: test
level: informative
legacy:
  number: 6.3.9
  file: tests-03-nfrmtv-09-branch-categories.md
heading: 3
title: Branch Categories
statement: |-
  For each element of type `$['$defs'].full_product_name_t` in `$.product_tree.branches` it SHALL be tested that
  ancestor nodes along the path exist which use the following branch categories `vendor` -> `product_name` -> `product_version` in that
  order starting with the Product tree node.

  > Other branch categories can be used before, after or between the aforementioned branch categories without making the test invalid.
paths:
- $.product_tree.branches
examples:
- verdict: fails
  json: |2-
        "branches": [
          {
            "category": "vendor",
            "name": "Example Company",
            "branches": [
              {
                "category": "product_name",
                "name": "Product A",
                "branches": [
                  {
                    "category": "patch_level",
                    "name": "91",
                    "product": {
                      "product_id": "CSAFPID-0002",
                      "name": "Example Company Product A Update 91"
                    }
                  }
                ]
              }
            ]
          }
        ]
  explanation:
  - The product `CSAFPID-0002` does not have any ancestor with the branch category `product_version`.
