  file: tests-01-mndtr-22-multiple-definition-in-revision-history.md
heading: 3
title: Multiple Definition in Revision History
statement: It SHALL be tested that items of the revision history do not contain the same version number.
paths:
- $.document.tracking.revision_history
examples:
- verdict: fails
  json: |2-
       "revision_history": [
          {
            "date": "2024-01-20T10:00:00.000Z",
            "number": "1",
            "summary": "Initial version."
          },
          {
            "date": "2024-01-21T10:00:00.000Z",
            "number": "1",
            "summary": "Some other changes."
          }
        ]
  explanation:
  - The revision history contains two items with the version number `1`.
