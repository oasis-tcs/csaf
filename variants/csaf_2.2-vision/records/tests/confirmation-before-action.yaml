id: confirmation-before-action
kind: test
level: recommended
topics:
- date-time
legacy:
  number: 6.2.56.1
  file: tests-02-rcmmndd-56-01-confirmation-before-action.md
heading: 4
title: Confirmation before Action
statement: |-
  For each item in `$.document.involvement.actions` with category `confirmation`
  it SHALL be tested that the `date` of the action is later than or equal to the newest item of actions
  it refers to through `referenced_action_ids`.
  As the timestamps might use different timezones, the sorting and comparison SHALL take timezones into account.
paths:
- $.document.involvement.actions[*]
examples:
- verdict: fails
  json: |2-
      "actions": [
        {
          "acting_entity_refs": [
            "EID-0001"
          ],
          "action_id": "ACN-1",
          "category": "notification",
          "date": "2024-01-11T09:00:00Z",
          "receiving_entity_refs": [
            "EID-0002"
          ],
          "status": "completed",
          "summary": "Reported vulnerability to vendor."
        },
        {
          "acting_entity_refs": [
            "EID-0002"
          ],
          "action_id": "ACN-2",
          "category": "confirmation",
          "date": "2024-01-02T15:00:00Z",
          "receiving_entity_refs": [
            "EID-0001"
          ],
          "referenced_action_ids": [
            "ACN-1"
          ],
          "status": "completed",
          "summary": "Confirmed receipt of the report."
        }
      ],
  explanation:
  - The `date` of `ACN-2` is older than the `date` of the newest item it refers to.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-56-01-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-56-01-02.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-56-01-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-56-01-12.json
    valid: true
