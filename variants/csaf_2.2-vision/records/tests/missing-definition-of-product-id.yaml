    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-12.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-13.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-13.result.json
