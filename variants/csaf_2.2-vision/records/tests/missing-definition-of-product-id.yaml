id: missing-definition-of-product-id
kind: test
level: mandatory
legacy:
  number: 6.1.1
  file: tests-01-mndtr-01-missing-definition-of-product-id.md
heading: 3
title: Missing Definition of Product ID
statement: |-
  For each element of type `$['$defs'].product_id_t` which is not inside a Full Product Name (type: `full_product_name_t`) and
  therefore reference an element within the `product_tree` it SHALL be tested that the Full Product Name element with the matching `product_id` exists.
  The same applies for all items of elements of type `$['$defs'].products_t`.
paths:
- $.document.involvement.actions[*].product_ids[*]
- $.document.notes[*].product_ids[*]
- $.product_tree.product_groups[*].product_ids[*]
- $.product_tree.product_paths[*].beginning_product_reference
- $.product_tree.product_paths[*].subpaths[*].next_product_reference
- $.vulnerabilities[*].first_known_exploitation_dates[*].product_ids[*]
- $.vulnerabilities[*].flags[*].product_ids[*]
- $.vulnerabilities[*].ids[*].product_ids[*]
- $.vulnerabilities[*].metrics[*].products[*]
- $.vulnerabilities[*].notes[*].product_ids[*]
- $.vulnerabilities[*].product_status.first_affected[*]
- $.vulnerabilities[*].product_status.first_fixed[*]
- $.vulnerabilities[*].product_status.fixed[*]
- $.vulnerabilities[*].product_status.known_affected[*]
- $.vulnerabilities[*].product_status.known_not_affected[*]
- $.vulnerabilities[*].product_status.last_affected[*]
- $.vulnerabilities[*].product_status.recommended[*]
- $.vulnerabilities[*].product_status.under_investigation[*]
- $.vulnerabilities[*].product_status.unknown[*]
- $.vulnerabilities[*].remediations[*].product_ids[*]
- $.vulnerabilities[*].threats[*].product_ids[*]
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "product_groups": [
          {
            "group_id": "CSAFGID-1020300",
            "product_ids": [
              "CSAFPID-9080700",
              "CSAFPID-9080701"
            ]
          }
        ]
      }
  explanation:
  - Neither `CSAFPID-9080700` nor `CSAFPID-9080701` were defined in the `product_tree`.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-02.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-03.json
    result: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-01-03.result.json
    valid: false
  valid:
