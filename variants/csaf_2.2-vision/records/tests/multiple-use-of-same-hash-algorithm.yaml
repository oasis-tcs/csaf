id: multiple-use-of-same-hash-algorithm
kind: test
level: mandatory
legacy:
  number: 6.1.25
  file: tests-01-mndtr-25-multiple-use-of-same-hash-algorithm.md
heading: 3
title: Multiple Use of Same Hash Algorithm
statement: It SHALL be tested that the same hash algorithm is not used multiple times in one item of file hashes.
paths:
- $.product_tree..branches[*].product.product_identification_helper.hashes[*].file_hashes
- $.product_tree.full_product_names[*].product_identification_helper.hashes[*].file_hashes
- $.product_tree.product_paths[*].full_product_name.product_identification_helper.hashes[*].file_hashes
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "name": "Product A",
            "product_id": "CSAFPID-9080700",
            "product_identification_helper": {
              "hashes": [
                {
                  "file_hashes": [
                    {
                      "algorithm": "sha256",
                      "value": "026a37919b182ef7c63791e82c9645e2f897a3f0b73c7a6028c7febf62e93838"
                    },
                    {
                      "algorithm": "sha256",
                      "value": "0a853ce2337f0608489ac596a308dc5b7b19d35a52b10bf31261586ac368b175"
                    }
                  ],
                  "filename": "product_a.so"
                }
              ]
             }
          }
        ]
      }
  explanation:
  - The hash algorithm `sha256` is used two times in one item of file hashes.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-25-01.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-25-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-25-12.json
    valid: true
