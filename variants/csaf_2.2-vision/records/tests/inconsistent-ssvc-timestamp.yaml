id: inconsistent-ssvc-timestamp
kind: test
level: mandatory
topics: [date-time, ssvc]
legacy:
  number: 6.1.49
  file: tests-01-mndtr-49-inconsistent-ssvc-timestamp.md
heading: 3
title: Inconsistent SSVC Timestamp
statement: |-
  For each vulnerability, it SHALL be tested that each SSVC `timestamp` is earlier than or equal to the `date` of the newest item of the
  `revision_history` if the document status is `final` or `interim`.
  As the timestamps might use different timezones, the sorting and comparison SHALL take timezones into account.
paths:
- $.vulnerabilities[*].metrics[*].content.ssvc_v2.timestamp
examples:
- verdict: fails
  json: |2-
      "document": {
        // ...
        "tracking": {
          // ...
          "revision_history": [
            {
              "date": "2024-01-24T10:00:00.000Z",
              "number": "1",
              "summary": "Initial version."
            }
          ],
          "status": "final",
          // ...
        }
      },
      // ...
      "vulnerabilities": [
        {
          "metrics": [
            {
              "content": {
                "ssvc_v2": {
                  // ...
                  "timestamp": "2024-07-13T10:00:00.000Z"
                }
              },
              // ...
            }
          ]
        }
      ]
  explanation:
  - The document is in status `final` but the SSVC `timestamp` is newer than the `date` of newest item in the `revision_history`.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-02.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-03.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-12.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-49-13.json
    valid: true
