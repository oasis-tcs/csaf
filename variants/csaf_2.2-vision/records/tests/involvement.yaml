id: involvement
kind: test
level: informative
legacy:
  number: 6.3.23.1
  file: tests-03-nfrmtv-23-01-involvement.md
heading: 4
title: Involvement
statement: |-
  It SHALL be tested that `$.document.involvement` exists.

  > Recording involvement actions helps the participating parties understand the disclosure timeline and who has engaged in the process.
applies-to:
  only:
  - csaf_vulnerability_report
paths:
- $.document.involvement
examples:
- verdict: fails
  json: |2-
      document: {
        // ...
        "distribution": {
          "tlp": {
            "label": "AMBER"
          }
        },
        "publisher": {
          "category": "other",
          "name": "OASIS CSAF TC",
          "namespace": "https://csaf.io"
        },
        // ...
      }
  explanation:
  - The vulnerability does not record any coordination activity in `$.document.involvement`.
notes:
- 'Recommendation:'
- It is recommended that issuing parties use `$.document.involvement` to record coordination milestones during the CVD process.
fixtures:
  failures:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-23-01-01.json
    valid: false
  valid:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-23-01-11.json
    valid: true
