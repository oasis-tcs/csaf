id: multiple-definition-of-entity-group-id
kind: test
level: mandatory
legacy:
  number: 6.1.64.8
  file: tests-01-mndtr-64-08-multiple-definition-of-entity-group-id.md
heading: 4
title: Multiple Definition of Entity Group ID
statement: |-
  For each Entity Group ID (type: `$['$defs'].entity_group_id_t`) in Entity Group elements (`$.document.involvement.entity_groups[*]`)
  it SHALL be tested that the `entity_group_id` was not already defined within the same document.
paths:
- $.document.involvement.entity_groups[*].entity_group_id
examples:
- verdict: fails
  json: |2-
      "entity_groups": [
        {
          "entity_group_id": "EGID-9001",
          "entity_ids": [
            "EID-0001",
            "EID-0003"
          ],
          "name": "JJ Research"
        },
        {
          "entity_group_id": "EGID-9001",
          "entity_ids": [
            "EID-0004",
            "EID-0005"
          ],
          "name": "J+J Research"
        }
      ]
  explanation:
  - '`EGID-9001` was defined twice.'
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-08-01.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-64-08-11.json
    valid: true
