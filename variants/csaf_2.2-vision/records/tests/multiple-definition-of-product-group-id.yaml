id: multiple-definition-of-product-group-id
kind: test
level: mandatory
legacy:
  number: 6.1.5
  file: tests-01-mndtr-05-multiple-definition-of-product-group-id.md
heading: 3
title: Multiple Definition of Product Group ID
statement: |-
  For each Product Group ID (type `$['$defs'].product_group_id_t`) Product Group elements (`$.product_tree.product_groups[*]`) it
  SHALL be tested that the `group_id` was not already defined within the same document.
paths:
- $.product_tree.product_groups[*].group_id
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "product_id": "CSAFPID-9080700",
            "name": "Product A"
          },
          {
            "product_id": "CSAFPID-9080701",
            "name": "Product B"
          },
          {
            "product_id": "CSAFPID-9080702",
            "name": "Product C"
          }
        ],
        "product_groups": [
          {
            "group_id": "CSAFGID-1020300",
            "product_ids": [
              "CSAFPID-9080700",
              "CSAFPID-9080701"
            ]
          },
          {
            "group_id": "CSAFGID-1020300",
            "product_ids": [
              "CSAFPID-9080700",
              "CSAFPID-9080702"
            ]
          }
        ]
      }
  explanation:
  - '`CSAFGID-1020300` was defined twice.'
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-05-01.json
    valid: false
