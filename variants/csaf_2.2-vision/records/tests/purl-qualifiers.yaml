id: purl-qualifiers
kind: test
level: mandatory
legacy:
  number: 6.1.42
  file: tests-01-mndtr-42-purl-qualifiers.md
heading: 3
title: PURL Qualifiers
statement: For each `product_identification_helper` object containing multiple PURLs it SHALL be tested that the PURLs only differ in their qualifiers.
paths:
- $.product_tree..branches[*].product.product_identification_helper.purls[*]
- $.product_tree.full_product_names[*].product_identification_helper.purls[*]
- $.product_tree.product_paths[*].full_product_name.product_identification_helper.purls[*]
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "name": "Product A",
            "product_id": "CSAFPID-9080700",
            "product_identification_helper": {
              "purls": [
                "pkg:maven/com.example/logging@1.3.4",
                "pkg:maven/com.example/audit@1.3.4"
              ]
            }
          }
        ]
      }
  explanation:
  - The two PURLs differ in the name component.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-42-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-42-02.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-42-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-42-12.json
    valid: true
