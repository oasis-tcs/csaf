id: latest-document-version
kind: test
level: mandatory
legacy:
  number: 6.1.16
  file: tests-01-mndtr-16-latest-document-version.md
heading: 3
title: Latest Document Version
statement: |-
  It SHALL be tested that document version has the same value as the `number` in the last item of the revision history when
  it is sorted ascending by `date` and as a second level criteria `number`.
  As the timestamps might use different timezones, the sorting SHALL take timezones into account.
  Build metadata is ignored in the comparison.
  Any pre-release part is also ignored if the document status is `draft`.
paths:
- $.document.tracking.version
examples:
- verdict: fails
  json: |2-
      "tracking": {
        // ...
        "revision_history": [
          {
            "date": "2024-01-21T09:00:00.000Z",
            "number": "1",
            "summary": "Initial version."
          },
          {
            "date": "2024-01-21T10:00:00.000Z",
            "number": "2",
            "summary": "Second version."
          }
        ],
        // ...
        "version": "1"
      }
  explanation:
  - The value of `number` of the last item after sorting is `2`. However, the document version is `1`.
notes:
- '> A tool MAY set the document version to the value of `number` of the last item in the revision history after sorting as a quick fix.'
