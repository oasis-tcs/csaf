id: product-version-range-without-vers
kind: test
level: recommended
legacy:
  number: 6.2.18
  file: tests-02-rcmmndd-18-product-version-range-without-vers.md
heading: 3
title: Product Version Range without VERS
statement: |-
  For each element of type `$['$defs'].branches_t` with `category` of `product_version_range` it SHALL be tested that
  the value of `name` indicates that the product version range is using VERS.

  > Compliance with the VERS specification itself is enforced via test [sec](#product-version-range-rules).
  > Unknown VERS types are detected via test [sec](#unknown-vers-type).
  >
  > To implement this test it is deemed sufficient that the value of `name` matches the following regex:
  >
  > ```
  >   ^vers:[a-z\\.\\-\\+][a-z0-9\\.\\-\\+]*/.+
  > ```

  The warning SHALL clearly advise to carefully check whether VERS can be used or the versions can be enumerated as
  the use of vls is only a fallback option.
  For more details, see sections [sec](#branches-type---category) and [sec](#branches-type---name-under-product-version-range).

  > It is planned to deprecate and finally remove the support for vls in future versions of this standard.
paths:
- $.product_tree..branches[*].name
examples:
- verdict: fails
  json: |2-
                "branches": [
                  {
                    "category": "product_version_range",
                    "name": ">4.2",
                    // ...
                  }
                ]
  explanation:
  - The version range `>4.2` is a valid vls but not valid according to the VERS specification.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-18-01.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-18-11.json
    valid: true
