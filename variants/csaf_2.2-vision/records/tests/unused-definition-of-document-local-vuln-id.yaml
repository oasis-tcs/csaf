id: unused-definition-of-document-local-vuln-id
kind: test
level: recommended
legacy:
  number: 6.2.57
  file: tests-02-rcmmndd-57-unused-definition-of-document-local-vuln-id.md
heading: 3
title: Unused Definition of Document-local Vuln ID
statement: |-
  For each element of type `$['$defs'].dl_vuln_id_t` in vulnerabilities (`$.vulnerabilities[*].dl_vuln_id`)
  it SHALL be tested that the `dl_vuln_id` is referenced somewhere within the same document.
paths:
- $.vulnerabilities[*].dl_vuln_id
examples:
- verdict: fails
  json: |-
    {
      // ...
      "document": {
        // ...
        "involvement": {
          "actions": [
            {
              "acting_entity_refs": [
                "EID-0001"
              ],
              "action_id": "ACN-1",
              "category": "notification",
              "date": "2024-01-01T09:00:00Z",
              "receiving_entity_refs": [
                "EID-0002"
              ],
              "status": "completed",
              "summary": "Reported vulnerability to vendor."
            },
            {
              "acting_entity_refs": [
                "EID-0002"
              ],
              "action_id": "ACN-2",
              "category": "confirmation",
              "date": "2024-01-02T15:00:00Z",
              "receiving_entity_refs": [
                "EID-0001"
              ],
              "referenced_action_ids": [
                "ACN-1"
              ],
              "status": "completed",
              "summary": "Confirmed receipt of the report."
            }
          ],
          // ...
        },
        // ...
      },
      "vulnerabilities": [
        {
          "dl_vuln_id": "VULN-1",
          "title": "A vulnerability with an unreferenced Document-local Vuln ID."
        }
      ]
    }
  explanation:
  - '`VULN-1` was defined but never used.'
notes:
- |-
  > A tool MAY remove the unused definition as a quick fix.
  > However, such quick fix shall not be applied if the test was skipped.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-57-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-57-02.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-57-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-57-12.json
    valid: true
