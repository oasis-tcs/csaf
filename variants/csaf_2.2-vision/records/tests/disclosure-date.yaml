heading: 4
title: Disclosure Date
statement: It SHALL be tested that `$.vulnerabilities[*].disclosure_date` exists.
applies-to:
  only:
  - csaf_vulnerability_report
paths:
- $.vulnerabilities[*].disclosure_date
