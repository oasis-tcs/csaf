- verdict: fails
  json: |2-
      "vulnerabilities": [
        {
          "cve": "CVE-1900-0001"
        }
      ]
  explanation:
  - The vulnerability does not have a `disclosure_date` element.
notes:
- 'Recommendation:'
- It is recommended that issuing parties use the disclosure date.
