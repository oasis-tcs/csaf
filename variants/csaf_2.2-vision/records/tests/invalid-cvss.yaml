id: invalid-cvss
kind: test
level: mandatory
legacy:
  number: 6.1.8
  file: tests-01-mndtr-08-invalid-cvss.md
heading: 3
title: Invalid CVSS
statement: |-
  It SHALL be tested that the given CVSS object is valid according to the referenced schema.
  The test SHALL fail if the object contains additional properties not defined in the referenced schema.
paths:
- $.vulnerabilities[*].metrics[*].content.cvss_v2
- $.vulnerabilities[*].metrics[*].content.cvss_v3
- $.vulnerabilities[*].metrics[*].content.cvss_v4
examples:
- verdict: fails
  json: |2-
      "cvss_v3": {
        "version": "3.1",
        "vectorString": "CVSS:3.1/AV:L/AC:L/PR:H/UI:R/S:U/C:H/I:H/A:H",
        "baseScore": 6.5
      }
  explanation:
  - The required element `baseSeverity` is missing.
notes:
- |-
  > A tool MAY add one or more of the missing properties `version`, `baseScore` and `baseSeverity` based on
  > the values given in `vectorString` as a quick fix.
