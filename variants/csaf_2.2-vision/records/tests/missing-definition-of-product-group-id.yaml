id: missing-definition-of-product-group-id
kind: test
level: mandatory
legacy:
  number: 6.1.4
  file: tests-01-mndtr-04-missing-definition-of-product-group-id.md
heading: 3
title: Missing Definition of Product Group ID
statement: |-
  For each element of type `$['$defs'].product_group_id_t` which is not inside a Product Group (`$.product_tree.product_groups[*]`) and
  therefore reference an element within the `product_tree` it SHALL be tested that the Product Group element with the matching `group_id` exists.
  The same applies for all items of elements of type `$['$defs'].product_groups_t`.
paths:
- $.document.involvement.actions[*].group_ids[*]
- $.document.notes[*].group_ids[*]
- $.vulnerabilities[*].first_known_exploitation_dates[*].group_ids[*]
- $.vulnerabilities[*].flags[*].group_ids[*]
- $.vulnerabilities[*].ids[*].group_ids[*]
- $.vulnerabilities[*].notes[*].group_ids[*]
- $.vulnerabilities[*].remediations[*].group_ids[*]
- $.vulnerabilities[*].threats[*].group_ids[*]
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "name": "Product A",
            "product_id": "CSAFPID-9080700"
          }
        ]
      },
      "vulnerabilities": [
        {
          "threats": [
            {
              "category": "exploit_status",
              "details": "Reliable exploits integrated in Metasploit.",
              "group_ids": [
                "CSAFGID-1020301"
              ]
            }
          ]
        }
      ]
  explanation:
  - '`CSAFGID-1020301` was not defined in the Product Tree.'
