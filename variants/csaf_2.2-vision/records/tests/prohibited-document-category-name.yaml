id: prohibited-document-category-name
kind: test
level: mandatory
legacy:
  number: 6.1.26
  file: tests-01-mndtr-26-prohibited-document-category-name.md
heading: 3
title: Prohibited Document Category Name
statement: |-
  It SHALL be tested that the document category is not equal to the (case insensitive) name (without the prefix `csaf_`) or
  value of any other profile than "CSAF Base".
  Any occurrences of dash, hyphen, minus, underscore, white space and invisible characters are removed from the values
  on both sides before the case insensitive match.

  > The characters listed above are independent of their graphical variants.
  > In general, all corresponding unicode characters are part of the group.
  > For example, dash, hyphen and underscore characters include, but are not limited to:
  >
  > - Em dash
  > - En dash
  > - Figure dash
  > - Horizontal bar
  > - Hyphen
  > - Hyphen-minus
  > - Non-breaking hyphen
  > - Low line
  > - Combining low line
  > - Fullwidth low line

  This applies for both, the comparison against the name and value.
  Also the value SHALL NOT start with the reserved prefix `csaf_` except if the value is exactly `csaf_base`.

  This is the only mandatory test related to the profile "CSAF Base" as the required fields SHALL be checked by validating the JSON schema.
applies-to:
  only:
  - csaf_base
paths:
- $.document.category
notes:
- '*Examples 1 (for currently prohibited values):*'
- |-
  ```
    Csaf_a
    CsaF_VeX
    CSafDeprecatedSecurity—Advisory
    csafvex
    Deprecated Security Advisory
    Informational Advisory
    Security      Advisory
    security-incident-response
    Superseded
    V_eX
    veX
    withdrawn
    Vulnerability＿rePORT
  ```
- '*Example 2 (which fails the test):*'
- |-
  ```
    "category": "Security_Incident_Response"
  ```
- '> The value `Security_Incident_Response` is the name of a profile where the space was replaced with underscores.'
