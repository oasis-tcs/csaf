id: use-of-sha-1-as-the-only-hash-algorithm
kind: test
level: recommended
legacy:
  number: 6.2.9
  file: tests-02-rcmmndd-09-use-of-sha-1-as-the-only-hash-algorithm.md
heading: 3
title: Use of SHA-1 As the Only Hash Algorithm
statement: |-
  It SHALL be tested that the hash algorithm `sha1` is not the only one present.

  > Since collision attacks exist for SHA-1 such value should be accompanied by a second cryptographically stronger hash.
  > This will allow users to double check the results.
paths:
- $.product_tree..branches[*].product.product_identification_helper.hashes[*].file_hashes
- $.product_tree.full_product_names[*].product_identification_helper.hashes[*].file_hashes
- $.product_tree.product_paths[*].full_product_name.product_identification_helper.hashes[*].file_hashes
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "name": "Product A",
            "product_id": "CSAFPID-9080700",
            "product_identification_helper": {
              "hashes": [
                {
                  "file_hashes": [
                    {
                      "algorithm": "sha1",
                      "value": "e067035314dd8673fe1c9fc6b01414fe0950fdc4"
                    }
                  ],
                  "filename": "product_a.so"
                }
              ]
            }
          }
        ]
      }
  explanation:
  - The hash algorithm `sha1` is used in one item of hashes without being accompanied by a second hash algorithm.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-09-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-09-02.json
    valid: true
