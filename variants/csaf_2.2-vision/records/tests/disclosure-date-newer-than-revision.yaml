id: disclosure-date-newer-than-revision
kind: test
level: recommended
topics: [revision-history, validation-time]
legacy:
  number: 6.2.33
  file: tests-02-rcmmndd-33-disclosure-date-newer-than-revision.md
heading: 3
title: Disclosure Date Newer than Revision History
statement: |-
  For each vulnerability, it SHALL be tested that the `disclosure_date` is earlier than or equal to the `date` of the newest item of the
  `revision_history` if the `disclosure_date` is in the past at the time of the test execution.
  As the timestamps might use different timezones, the sorting and comparison SHALL take timezones into account.

  > The result of the test is dependent upon the time of the execution of the test - it might change for a given CSAF document over time.
  > However, the latest version of a CSAF document should always pass the test.
paths:
- $.vulnerabilities[*].disclosure_date
examples:
- verdict: fails
  json: |2-
      "document": {
        // ...
        "distribution": {
          "tlp": {
            "label": "GREEN"
          }
        },
        // ...
        "tracking": {
          "current_release_date": "2024-01-24T10:00:00.000Z",
          // ...
          "initial_release_date": "2024-01-24T10:00:00.000Z",
          "revision_history": [
            {
              "date": "2024-01-24T10:00:00.000Z",
              "number": "1",
              "summary": "Initial version."
            }
          ],
          "status": "final",
          "version": "1"
        }
      },
      "vulnerabilities": [
        {
          "disclosure_date": "2024-02-24T10:00:00.000Z"
        }
      ]
  explanation:
  - The `disclosure_date` is in the past but newer than the date of newest item in the `revision_history`.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-02.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-03.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-12.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-33-13.json
    valid: true
