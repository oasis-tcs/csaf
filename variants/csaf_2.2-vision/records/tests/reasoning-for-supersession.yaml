id: reasoning-for-supersession
kind: test
level: mandatory
legacy:
  number: 6.1.27.18
  file: tests-01-mndtr-27-18-reasoning-for-supersession.md
heading: 4
title: Reasoning for Supersession
statement: |-
  If the document language is English or unspecified, it SHALL be tested that exactly one item in document notes exists
  that has the title `Reasoning for Supersession`.
  The `category` of this item SHALL be `description`.
applies-to:
  only:
  - csaf_superseded
paths:
- $.document.notes
examples:
- verdict: fails
  json: |2-
      "notes": [
        {
          "category": "details",
          "text": "This CSAF document contained example data and was withdrawn to create test data.",
          "title": "Reasoning for Supersession"
        }
      ],
  explanation:
  - The note has the correct title. However, it uses the wrong category.
