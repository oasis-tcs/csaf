id: usage-of-non-latest-ssvc-decision-point-version
kind: test
level: informative
topics: [ssvc]
legacy:
  number: 6.3.13
  file: tests-03-nfrmtv-13-usage-of-non-latest-ssvc-decision-point-version.md
heading: 3
title: Usage of Non-Latest SSVC Decision Point Version
statement: |-
  For each SSVC decision point given under `selections` with a registered `namespace`, it SHALL be tested the latest decision point
  `version` available at the time of the `timestamp` was used.
  The test SHALL fail if a later `version` was used.
  Namespaces reserved for special purpose SHALL be treated as per their definition.

  > A list of all valid decision points of registered namespaces including their values is available at the
  > SSVC repository (see [cite](#SSVC-DP)).
paths:
- $.vulnerabilities[*].metrics[*].content.ssvc_v2.selections[*]
examples:
- verdict: fails
  json: |2-
      "ssvc_v2": {
        // ...
        "selections": [
          {
            "key": "MI",
            "name": "Mission Impact",
            "namespace": "ssvc",
            // ...
            "version": "1.0.0"
          }
        ],
        "timestamp": "2024-01-24T10:00:00.000Z"
      }
  explanation:
  - At the timestamp `2024-01-24T10:00:00.000Z` version `2.0.0` of the SSVC decision point `Mission Impact` was already available.
fixtures:
  failures:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-13-01.json
    valid: true
  valid:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-13-11.json
    valid: true
