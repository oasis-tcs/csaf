heading: 3
title: Unknown Hash Algorithm
statement: "For each element of type `$['$defs'].full_product_name_t..product_identification_helper..hashes[*]..file_hashes[*]..algorithm`,\nit SHALL be tested that the hash algorithm is supported by the implementation.\nThe warning SHALL differentiate between the values mentioned in section [sec](#full-product-name-type---product-identification-helper---hashes)\nand those not mentioned there.\n\n> Different implementations might support different hash algorithms.\n> Usually, unknown hash algorithms might hinder the automated matching of hashes.\n> However, it is expected that the test is able to recognize all algorithms mentioned in the standard.\n> The differentiation will help users analyzing the result of the test and addressing the issue appropriately.  "
paths:
- $.product_tree..branches[*].product.product_identification_helper.hashes[*].file_hashes[*].algorithm
- $.product_tree.full_product_names[*].product_identification_helper.hashes[*].file_hashes[*].algorithm
- $.product_tree.product_paths[*].full_product_name.product_identification_helper.hashes[*].file_hashes[*].algorithm
