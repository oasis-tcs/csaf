id: usage-of-ssvc-decision-point-namespace-with-extension-in-non-tlp-clear-document
kind: test
level: informative
topics: [ssvc]
legacy:
  number: 6.3.15
  file: tests-03-nfrmtv-15-usage-of-ssvc-decision-point-namespace-with-extension-in-non-tlp-clear-document.md
heading: 3
title: Usage of SSVC Decision Point Namespace with Extension in Non-TLP:CLEAR Document
anchor: usage-of-ssvc-decision-point-namespace-with-extension-in-non-tlp-clear-document
statement: |-
  For each SSVC decision point given under `selections`, it SHALL be tested that the `namespace` does not use an extension
  if the document is not labeled `TLP:CLEAR`.
  Namespaces reserved for special purpose SHALL be treated as per their definition.

  > To implement the check for an extensions part in the `namespace`,
  > it is deemed sufficient to check whether the `namespace` contains a `/`.
paths:
- $.vulnerabilities[*].metrics[*].content.ssvc_v2.selections[*].namespace
examples:
- verdict: fails
  json: |2-
      {
        "document": {
          // ...
          "distribution": {
            "tlp": {
              "label": "GREEN"
            }
          },
          // ...
        }
        "vulnerabilities": [
          {
            "metrics": [
              {
                "content": {
                  "ssvc_v2": {
                    // ...
                    "selections": [
                      {
                        // ...
                        "namespace": "ssvc//.example.test#refined-technical-impacts",
                        // ...
                      }
                    ],
                    // ...
                  }
                },
                // ...
              }
            ]
          }
        ]
      }
  explanation:
  - |-
    The namespace contains the extension `.example.test#refined-technical-impacts`.
    Its decision point definitions might therefore not be known to the reader of the document.
fixtures:
  failures:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-15-01.json
    valid: true
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-15-02.json
    valid: true
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-15-03.json
    valid: true
  valid:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-15-11.json
    valid: true
