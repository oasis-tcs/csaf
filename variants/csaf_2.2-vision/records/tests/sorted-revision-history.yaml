id: sorted-revision-history
kind: test
level: mandatory
topics: [revision-history]
legacy:
  number: 6.1.14
  file: tests-01-mndtr-14-sorted-revision-history.md
heading: 3
title: Sorted Revision History
statement: |-
  It SHALL be tested that the value of `number` of items of the revision history are sorted ascending when the items are sorted
  ascending by `date` and as a second level criteria `number`.
  As the timestamps might use different timezones, the sorting SHALL take timezones into account.

  In order to create consistent results in the case of mixed integer and semantic versioning (failing test
  [sec](#mixed-integer-and-semantic-versioning)), implementations SHALL map items with integer versioning to
  semantic versioning by appending `.0.0` to the corresponding values.
  Any value that is not a valid integer nor semantic version SHOULD be ignored in this test as the schema test will fail.
  The aforementioned rules are solely used during the processing to create consistent test results.

  > These processing rules are not a suggested quick fix for test [sec](#mixed-integer-and-semantic-versioning)
  > but implementation guidance for this edge case.
paths:
- $.document.tracking.revision_history
examples:
- verdict: fails
  json: |2-
      "revision_history": [
        {
          "date": "2024-01-22T10:00:00.000Z",
          "number": "2",
          "summary": "Second version."
        },
        {
          "date": "2024-01-23T10:00:00.000Z",
          "number": "1",
          "summary": "Initial version."
        }
      ]
  explanation:
  - The first item when sorted by `date` has a higher version number than the second.
