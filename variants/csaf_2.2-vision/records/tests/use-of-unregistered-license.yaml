id: use-of-unregistered-license
kind: test
level: informative
legacy:
  number: 6.3.17
  file: tests-03-nfrmtv-17-use-of-unregistered-license.md
heading: 3
title: Use of Unregistered License
statement: |-
  It SHALL be tested that the all license identifiers and exceptions are listed either in the official SPDX license identifier list
  or AboutCode's "ScanCode LicenseDB".
paths:
- $.document.license_expression
examples:
- verdict: fails
  json: '    "license_expression": "LicenseRef-www.example.com-no-work-pd",'
  explanation:
  - |-
    The `license_expression` contains a license identifier that is neither listed in the official SPDX license identifier list
    nor AboutCode's "ScanCode LicenseDB".
fixtures:
  failures:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-17-01.json
    valid: true
  valid:
  - name: informative/oasis_csaf_tc-csaf_2_1-2024-6-3-17-11.json
    valid: true
