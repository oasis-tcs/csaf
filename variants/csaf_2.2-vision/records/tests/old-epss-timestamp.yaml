id: old-epss-timestamp
kind: test
level: recommended
legacy:
  number: 6.2.41
  file: tests-02-rcmmndd-41-old-epss-timestamp.md
heading: 3
title: Old EPSS Timestamp
statement: |-
  For each vulnerability, it SHALL be tested that the youngest EPSS `timestamp` is not more than 15 days older than to the `date`
  of the newest item of the `revision_history` if the document status is `final` or `interim`.
  As the timestamps might use different timezones, the sorting and comparison SHALL take timezones into account.
paths:
- $.vulnerabilities[*].metrics[*].content.epss.timestamp
examples:
- verdict: fails
  json: |2-
      "document": {
        // ...
        "distribution": {
          "tlp": {
            "label": "CLEAR"
          }
        },
        // ...
        "tracking": {
          // ...
          "revision_history": [
            {
              "date": "2024-01-24T10:00:00.000Z",
              "number": "1",
              "summary": "Initial version."
            }
          ],
          "status": "final",
          // ...
        }
      },
      "vulnerabilities": [
        {
          "cve": "CVE-1900-0001",
          "metrics": [
            {
              "content": {
                "epss": {
                  "percentile": "0.999990000",
                  "probability": "0.975570000",
                  "timestamp": "2024-07-13T10:00:00.000Z"
                }
              },
              "products": [
                "CSAFPID-9080700"
              ]
            }
          ]
        }
      ]
  explanation:
  - The document is in status `final` but the EPSS `timestamp` is more than 15 days older than the `date` of newest item in the `revision_history`.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-41-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-41-02.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-41-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-41-12.json
    valid: true
