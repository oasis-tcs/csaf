id: stacked-branch-categories
kind: test
level: mandatory
legacy:
  number: 6.1.57
  file: tests-01-mndtr-57-stacked-branch-categories.md
heading: 3
title: Stacked Branch Categories
statement: |-
  For each `full_product_name_t` element under `$.product_tree.branches`, it SHALL be tested that branch categories used along the path
  leading to the `full_product_name_t` element appear only once in the path.
  The sole exception is `product_family` which can occur multiple times.
  Therefore, `product_family` SHALL be ignored in the test.
paths:
- $.product_tree..branches[*].category
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "branches": [
          {
            "branches": [
              {
                // ...
                "category": "vendor",
                "name": "ISDuBA"
              }
            ],
            "category": "vendor",
            "name": "Open Source"
          }
        ]
      }
  explanation:
  - The category `vendor` was used twice along the path.
notes:
- '> A tool MAY collapse the stacked branch categories as a quick fix, if applicable.'
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-57-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-57-02.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-57-03.json
    valid: false
  valid:
