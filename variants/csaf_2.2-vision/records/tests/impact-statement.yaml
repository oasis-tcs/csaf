id: impact-statement
kind: test
level: mandatory
legacy:
  number: 6.1.27.9
  file: tests-01-mndtr-27-09-impact-statement.md
heading: 4
title: Impact Statement
statement: |-
  For each item in `$.vulnerabilities[*].product_status.known_not_affected` it SHALL be tested that
  a corresponding impact statement exist in `$.vulnerabilities[*].flags` or `$.vulnerabilities[*].threats`.
  For the latter one, the `category` value for such a statement SHALL be `impact`.
applies-to:
  only:
  - csaf_vex
paths:
- $.vulnerabilities[*].flags
- $.vulnerabilities[*].threats
examples:
- verdict: fails
  json: |2-
      "product_tree": {
        "full_product_names": [
          {
            "product_id": "CSAFPID-9080700",
            "name": "Product A"
          },
          {
            "product_id": "CSAFPID-9080701",
            "name": "Product B"
          },
          {
            "product_id": "CSAFPID-9080702",
            "name": "Product C"
          }
        ],
        "product_groups": [
          {
            "group_id": "CSAFGID-0001",
            "product_ids": [
              "CSAFPID-9080700",
              "CSAFPID-9080701"
            ]
          }
        ]
      },
      "vulnerabilities": [
        {
          // ...
          "product_status": {
            "known_not_affected": [
              "CSAFPID-9080700",
              "CSAFPID-9080701",
              "CSAFPID-9080702"
            ]
          },
          "threats": [
            {
              "category": "impact",
              "details": "The vulnerable code is not present in these products.",
              "group_ids": [
                "CSAFGID-0001"
              ]
            }
          ]
        }
      ]
  explanation:
  - |-
    There is no impact statement for `CSAFPID-9080702`.

    Note: The impact statement for `CSAFPID-9080700` and `CSAFPID-9080701` is given through `CSAFGID-0001`.
