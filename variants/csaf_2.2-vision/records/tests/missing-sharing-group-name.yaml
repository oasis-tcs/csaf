        "distribution": {
          "sharing_group": {
            "id": "ffffffff-ffff-ffff-ffff-ffffffffffff"
          },
          // ...
        },
  explanation:
  - The Max UUID is used but the sharing group name does not exist.
notes:
- '> A tool MAY add the corresponding sharing group name as a quick fix.'
