id: released-revision-history
kind: test
level: mandatory
topics: [revision-history]
legacy:
  number: 6.1.18
  file: tests-01-mndtr-18-released-revision-history.md
heading: 3
title: Released Revision History
statement: It SHALL be tested that no item of the revision history has a `number` of `0` or `0.y.z` when the document status is `final` or `interim`.
paths:
- $.document.tracking.revision_history[*].number
examples:
- verdict: fails
  json: |2-
        "tracking": {
          // ...
          "revision_history": [
            {
              "date": "2023-09-17T10:00:00.000Z",
              "number": "0",
              "summary": "First draft"
            },
            {
              "date": "2024-01-21T10:00:00.000Z",
              "number": "1",
              "summary": "Initial version."
            }
          ],
          "status": "final",
          "version": "1"
        }
  explanation:
  - The document status is `final` but the revision history includes an item which has `0` as value for `number`.
notes:
- '> A tool MAY remove the items with a `number` of `0` or `0.y.z` from the revision history as a quick fix.'
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-18-01.json
    valid: false
