legacy:
  number: 6.1.40
  file: tests-01-mndtr-40-invalid-sharing-group-name.md
heading: 3
title: Invalid Sharing Group Name
statement: It SHALL be tested that the value of sharing group name does not equal the reserved values from section [sec](#document-property---distribution-sharing-group) if the precondition is not fulfilled.
paths:
- $.document.distribution.sharing_group.name
examples:
- verdict: fails
  json: |2-
        "distribution": {
          "sharing_group": {
            "id": "5868d6be-b28a-404e-a245-0b5093b31b8b",
            "name": "Public"
          },
          // ...
        },
  explanation:
  - The sharing group name is `Public` but it does not use the Max UUID.
notes:
- '> A tool MAY update the sharing group name as a quick fix.'
