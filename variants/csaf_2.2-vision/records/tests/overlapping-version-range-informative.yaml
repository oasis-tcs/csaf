                  "product": {
                    "name": "Example Company Product A >2.1.0|<4.2.0",
                    "product_id": "CSAFPID-9080700"
                  }
                },
                {
                  "category": "product_version",
                  "name": "2.4.0",
                  "product": {
                    "name": "Example Company Product A 2.4.0",
                    "product_id": "CSAFPID-9080701"
                  }
                }
              ],
              "category": "product_name",
              "name": "Product A"
            }
          ],
          "category": "vendor",
          "name": "Example Company"
        }
      ]
    },
