id: inconsistent-epss-timestamp
kind: test
level: mandatory
topics: [date-time]
legacy:
  number: 6.1.51
  file: tests-01-mndtr-51-inconsistent-epss-timestamp.md
heading: 3
title: Inconsistent EPSS Timestamp
statement: |-
  For each vulnerability, it SHALL be tested that each EPSS `timestamp` is earlier than or equal to the `date` of the newest item of the
  `revision_history` if the document status is `final` or `interim`.
  As the timestamps might use different timezones, the sorting and comparison SHALL take timezones into account.
paths:
- $.vulnerabilities[*].metrics[*].content.epss.timestamp
examples:
- verdict: fails
  json: |2-
      "document": {
        // ...
        "distribution": {
          "tlp": {
            "label": "CLEAR"
          }
        },
        // ...
        "tracking": {
          // ...
          "revision_history": [
            {
              "date": "2024-01-24T10:00:00.000Z",
              "number": "1",
              "summary": "Initial version."
            }
          ],
          "status": "final",
          // ...
        }
      },
      "vulnerabilities": [
        {
          "cve": "CVE-1900-0001",
          "metrics": [
            {
              "content": {
                "epss": {
                  "percentile": "0.999990000",
                  "probability": "0.975570000",
                  "timestamp": "2024-07-13T10:00:00.000Z"
                }
              },
              "products": [
                "CSAFPID-9080700"
              ]
            }
          ]
        }
      ]
  explanation:
  - The document is in status `final` but the EPSS `timestamp` is newer than the `date` of newest item in the `revision_history`.
fixtures:
  failures:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-01.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-02.json
    valid: false
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-03.json
    valid: false
  valid:
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-11.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-12.json
    valid: true
  - name: mandatory/oasis_csaf_tc-csaf_2_1-2024-6-1-51-13.json
    valid: true
