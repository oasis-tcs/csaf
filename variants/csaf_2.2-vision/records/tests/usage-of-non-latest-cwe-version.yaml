id: usage-of-non-latest-cwe-version
kind: test
level: recommended
legacy:
  number: 6.2.24
  file: tests-02-rcmmndd-24-usage-of-non-latest-cwe-version.md
heading: 3
title: Usage of Non-Latest CWE Version
statement: |-
  For each item in the CWE array it SHALL be tested that the latest CWE version available at the time of the last revision was used.
  The test SHALL fail if a later CWE version was used.
paths:
- $.vulnerabilities[*].cwes[*]
examples:
- verdict: fails
  json: |2-
      "document": {
        // ...
        "tracking": {
          "current_release_date": "2024-01-21T10:00:00.000Z",
          // ...
        }
      },
      "vulnerabilities": [
        {
          "cwes": [
            {
              "id": "CWE-256",
              "name": "Plaintext Storage of a Password",
              "version": "4.12"
            }
          ]
        }
      ]
  explanation:
  - The CWE version listed is `4.12`. However, version `4.13` was most recent version when the document was released on `2024-01-21T10:00:00.000Z`.
notes:
- |-
  > A tool MAY suggest to use the latest version available at the time of the `current_release_date`.
  > This is most likely also the overall latest CWE version as modifications to a CSAF document lead to a new `current_release_date`.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-01.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-02.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-03.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-04.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-12.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-13.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-24-14.json
    valid: true
