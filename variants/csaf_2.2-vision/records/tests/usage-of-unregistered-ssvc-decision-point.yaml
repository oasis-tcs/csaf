id: usage-of-unregistered-ssvc-decision-point
kind: test
level: recommended
topics: [ssvc]
legacy:
  number: 6.2.35
  file: tests-02-rcmmndd-35-usage-of-unregistered-ssvc-decision-point.md
heading: 3
title: Usage of Unregistered SSVC Decision Point Base Namespace in TLP:CLEAR Document
anchor: usage-of-unregistered-ssvc-decision-point-base-namespace-in-tlp-clear-document
statement: |-
  For each SSVC decision point given under `selections`, it SHALL be tested that the base `namespace` is not an unregistered one
  if the document is labeled `TLP:CLEAR`.
  Namespaces reserved for special purpose SHALL be treated as per their definition.

  > To implement this determine the base namespace in this test, it is deemed sufficient to remove any characters including
  > and after the first `/`.
paths:
- $.vulnerabilities[*].metrics[*].content.ssvc_v2.selections[*].namespace
examples:
- verdict: fails
  json: |2-
      {
        "document": {
          // ...
          "distribution": {
            "tlp": {
              "label": "CLEAR"
            }
          },
          // ...
        }
        "vulnerabilities": [
          {
            "metrics": [
              {
                "content": {
                  "ssvc_v2": {
                    // ...
                    "selections": [
                      {
                        // ...
                        "namespace": "x_example.unregistered#namespace",
                        // ...
                      }
                    ],
                    // ...
                  }
                },
                // ...
              }
            ]
          }
        ]
      }
  explanation:
  - |-
    The namespace `x_example.unregistered#namespace` is an unregistered base namespace.
    Its decision point definitions might therefore not be known to the reader of the document.
fixtures:
  failures:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-35-01.json
    valid: true
  valid:
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-35-11.json
    valid: true
  - name: recommended/oasis_csaf_tc-csaf_2_1-2024-6-2-35-12.json
    valid: true
